[project]
name = "market-approach-desk"
version = "0.1.0"
description = "Runs a commercial placement's market approach so every carrier is approached at most once per risk and stage."
requires-python = "==3.12.*"
readme = "README.md"
license = { file = "LICENSE" }

# Exact pins, matching the dev group, so the lockfile is the single source of truth and an upgrade
# is always a deliberate reviewable change.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
]

[dependency-groups]
dev = [
    "ruff==0.14.5",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    # httpx — required by Starlette's TestClient, and by the live-classification transport, which
    # lives under tests/ for the same reason it does in project 1: the shipped package must not be
    # able to dial a provider.
    "httpx==0.28.1",
    "pytest-asyncio==1.4.0",
    "asyncpg-stubs>=0.31.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_approach_desk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Alembic writes these and their shape is its business, not this project's style guide. Excluded
# rather than reformatted, so a regenerated migration does not arrive with a lint failure attached.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # prefer pathlib
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "n8n"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=market_approach_desk",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
    # The default run is offline and needs no database. `make gate` adds the integration mark.
    "-m", "not integration",
]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: requires the local PostgreSQL container (make db-up)",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
